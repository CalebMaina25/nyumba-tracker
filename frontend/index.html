<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyumbaTracker</title>
<script>
// WARM SERVER IMMEDIATELY - FIXES SLOW LOGIN
fetch("https://nyumba-tracker-1.onrender.com/health").catch(()=>{});
fetch("https://nyumba-tracker-1.onrender.com/").catch(()=>{});
</script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100 flex items-center justify-center p-4">
  
<div class="max-w-5xl w-full grid md:grid-cols-2 gap-0 rounded-[2rem] overflow-hidden shadow-2xl bg-white">
  
  <!-- LEFT - Colorful -->
  <div class="bg-gradient-to-br from-emerald-500 to-teal-600 p-10 text-white flex flex-col justify-between">
    <div>
      <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-emerald-600 text-2xl font-bold mb-6">N</div>
      <h1 class="text-4xl font-black leading-tight">Karibu,<br>Landlord.</h1>
      <p class="mt-4 opacity-90">Manage rentals like M-Pesa. Fast, colorful, simple.</p>
    </div>
    <div class="mt-10 bg-white/20 backdrop-blur rounded-2xl p-4">
      <p class="text-sm">✓ M-Pesa auto-tracking<br>✓ Tenant reminders<br>✓ Instant receipts</p>
    </div>
  </div>

  <!-- RIGHT - Login -->
  <div class="p-10 bg-white">
    <div class="flex gap-4 mb-6">
      <button id="loginTab" class="font-bold border-b-2 border-emerald-500 pb-1">Login</button>
      <button id="regTab" class="text-gray-400">Register</button>
    </div>

    <input id="nameInput" placeholder="Full Name" class="w-full bg-gray-50 border rounded-xl px-4 py-3 mb-3">
    <input id="passInput" type="password" placeholder="Password" class="w-full bg-gray-50 border rounded-xl px-4 py-3 mb-4">

    <button id="loginBtn" onclick="login()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition">
      Login →
    </button>
    
    <p id="msg" class="text-center mt-3 text-sm text-gray-500"></p>
    <p id="warmMsg" class="text-center mt-2 text-xs text-emerald-600">Server warming up... first login takes 20s ⏳</p>
    
    <a href="landing.html" class="block text-center mt-6 text-sm text-gray-400">← Back to Home</a>
  </div>
</div>

<script>
const API = "https://nyumba-tracker-1.onrender.com";

async function login(){
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  const warm = document.getElementById('warmMsg');
  
  btn.disabled = true;
  btn.innerText = "Waking server...";
  warm.innerText = "Please wait - Render is waking up (30 sec first time)";

  try{
    const res = await fetch(API+"/api/auth/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        name: document.getElementById('nameInput').value,
        password: document.getElementById('passInput').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.message);
    localStorage.setItem('user', JSON.stringify(data));
    location.href = "dashboard.html";
  }catch(e){
    msg.innerText = e.message;
    btn.disabled = false;
    btn.innerText = "Login →";
    warm.innerText = "Tip: Wait 30s and try again - free server sleeps";
  }
}
// Keep alive every 14 mins
setInterval(()=>fetch(API+"/health").catch(()=>{}), 14*60*1000);
</script>
</body>
</html>
